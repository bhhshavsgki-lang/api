name: Dynamic VLESS WS-TLS Tunnel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      UUID: "99324a44-8702-4a01-a400-cecddd6e2e0b"
      # Your preferred clean Cloudflare CDN IP (changeable anytime)
      CDN_IP: "104.18.37.127"

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Download Xray and Cloudflared
      run: |
        wget -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip xray.zip -d xray
        wget -O cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared

    - name: Create Xray Config
      run: |
        cat << 'EOF' > xray/config.json
        {
          "log": { "loglevel": "none" },
          "inbounds": [{
            "port": 10008,
            "protocol": "vless",
            "settings": {
              "clients": [{ "id": "${{ env.UUID }}" }],
              "decryption": "none"
            },
            "streamSettings": {
              "network": "ws",
              "wsSettings": { "path": "/?ed=2048" }
            }
          }],
          "outbounds": [{ "protocol": "freedom" }]
        }
        EOF

    - name: Start Xray & Quick Tunnel
      run: |
        ./xray/xray run -config xray/config.json &
        ./cloudflared tunnel --url http://localhost:10008 --no-autoupdate > tunnel.log 2>&1 &
        sleep 6

    - name: Generate Your Custom Format VLESS Link
      run: |
        # Extract the fresh quick tunnel domain generated by cloudflared
        TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" tunnel.log | head -n 1)
        TUNNEL_DOMAIN=$(echo $TUNNEL_URL | awk -F/ '{print $3}')
        
        if [ -z "$TUNNEL_DOMAIN" ]; then
          echo "Error: Failed to retrieve tunnel domain."
          exit 1
        fi

        # Construct the VLESS link matching your exact line format and parameters
        VLESS_LINK="vless://${{ env.UUID }}@${{ env.CDN_IP }}:443/?type=ws&encryption=none&flow=&host=${TUNNEL_DOMAIN}&path=%2F%3Fed%3D2048&security=tls&sni=${TUNNEL_DOMAIN}&fp=randomized#⭐GitHub-WS-TLS-6H"

        echo "=================================================="
        echo "COPY YOUR VLESS WS-TLS LINK BELOW:"
        echo "$VLESS_LINK"
        echo "=================================================="

        echo "Keeping runner alive for up to 6 hours..."
        sleep 21600
