name: Custom IP VLESS Tunnel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      UUID: "99324a44-8702-4a01-a400-cecddd6e2e0b"
      CUSTOM_IP: "104.18.37.127"
      DOMAIN: "v2raycdn.dpdns.org"
      WS_PATH: "/?ed=2048"

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Download Xray and Cloudflared
      run: |
        wget -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip xray.zip -d xray
        wget -O cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared

    - name: Create Xray Config
      run: |
        cat << EOF > xray/config.json
        {
          "log": { "loglevel": "none" },
          "inbounds": [{
            "port": 10008,
            "protocol": "vless",
            "settings": {
              "clients": [{ "id": "${{ env.UUID }}" }],
              "decryption": "none"
            },
            "streamSettings": {
              "network": "ws",
              "wsSettings": { "path": "/?ed=2048" }
            }
          }],
          "outbounds": [{ "protocol": "freedom" }]
        }
        EOF

    - name: Start Xray & Tunnel
      run: |
        ./xray/xray run -config xray/config.json &
        ./cloudflared tunnel --url http://localhost:10008 --no-autoupdate > tunnel.log 2>&1 &
        sleep 5
        echo "Tunnel active and bound."

    - name: Generate Your Custom VLESS Link
      run: |
        # URL encode the path parameter for the link
        ENCODED_PATH="%2F%3Fed%3D2048"
        
        VLESS_LINK="vless://${{ env.UUID }}@${{ env.CUSTOM_IP }}:443/?type=ws&encryption=none&flow=&host=${{ env.DOMAIN }}&path=${{ env.WS_PATH }}&security=tls&sni=${{ env.DOMAIN }}&fp=randomized#⭐GitHub-Custom-IP-6H"
        
        echo "=================================================="
        echo "COPY YOUR CUSTOM VLESS LINK BELOW:"
        echo "$VLESS_LINK"
        echo "=================================================="
        
        echo "Keeping runner alive for 6 hours..."
        sleep 21600
